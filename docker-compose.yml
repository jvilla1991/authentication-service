services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: table_mimic
      POSTGRES_USER: table_mimic_user
      POSTGRES_PASSWORD: localpassword
      POSTGRES_HOST_AUTH_METHOD: trust
    # Host 5434 (the port dev/local profiles expect). 5433 is taken by the
    # native Postgres on this machine, so binding there would collide.
    ports:
      - "5434:5432"
    volumes:
      - table_mimic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U table_mimic_user -d table_mimic"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  table_mimic_pgdata:
