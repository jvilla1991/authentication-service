services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: table_mimic
      POSTGRES_USER: table_mimic_user
      POSTGRES_PASSWORD: localpassword
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - table_mimic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U table_mimic_user -d table_mimic"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  table_mimic_pgdata:
