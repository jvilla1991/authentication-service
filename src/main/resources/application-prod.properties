# ── Prod profile ──────────────────────────────────────────────────────────────
# All secrets must be supplied as environment variables.
# Activate with: SPRING_PROFILES_ACTIVE=prod

spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=auth

# Actuator — expose only the health endpoint for the App Runner health check.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Allowed SPA origins for CORS — supplied by Terraform as the frontend CloudFront domain.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

DECODER_KEY=${DECODER_KEY}
