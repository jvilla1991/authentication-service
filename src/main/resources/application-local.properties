# ── Local profile ─────────────────────────────────────────────────────────────
# Local-development profile and the default (see application.properties).
# Connects to a local PostgreSQL: table_mimic database, `auth` schema.
#
# Requires a PostgreSQL listening on the port below with database `table_mimic`
# and role `table_mimic_user` / `localpassword`. The repo's docker-compose.yml
# provisions exactly this — start it (`docker compose up -d`) before running.

spring.datasource.url=jdbc:postgresql://127.0.0.1:5434/table_mimic
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=table_mimic_user
spring.datasource.password=localpassword

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=auth

# Local only — wipes and re-runs all migrations on checksum mismatch.
# Never set this in prod: it will drop your entire schema.
spring.flyway.clean-on-validation-error=true
spring.flyway.clean-disabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

logging.level.org.flywaydb=INFO

# Local-only JWT signing key (256-bit / Base64-encoded). Safe to commit —
# only used locally. Generate your own for prod (see .env.example).
DECODER_KEY=YkEet1SsZyUJo6OP1u54HB+kptgVM4YsbxJQWgeGRMY=
