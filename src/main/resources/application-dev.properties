# ── Dev profile ───────────────────────────────────────────────────────────────
# H2 in-memory database — no PostgreSQL installation required locally.
# The INIT clause pre-creates the 'auth' schema that Hibernate expects.

spring.datasource.url=jdbc:h2:mem:auth-dev;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS AUTH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=auth

# Dev-only JWT signing key (256-bit / Base64-encoded).
# Safe to commit — only used locally. Generate your own for prod (see .env.example).
DECODER_KEY=YkEet1SsZyUJo6OP1u54HB+kptgVM4YsbxJQWgeGRMY=
